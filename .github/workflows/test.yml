name: moonbit-ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: MoonBit check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit stable
        uses: moonbitlang/setup-moonbit@v1.2.0
        with:
          version: latest

      - name: Format check
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Native regression test
        run: moon test --target native --deny-warn

      - name: Public API stability
        shell: bash
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti

  benchmark:
    name: Reproducible benchmark
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MoonBit stable
        uses: moonbitlang/setup-moonbit@v1.2.0
        with:
          version: latest
      - name: Run benchmark example
        run: moon run --target native benchmarks
