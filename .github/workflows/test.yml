name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: moonbitlang/setup-moonbit@v1.2.0
        with:
          version: '0.10.3'

      - name: check
        run: moon check

      - name: test
        run: moon test

      - name: fmt
        run: moon fmt -- --deny-warn

      - name: info
        run: moon info -- --deny-warn
